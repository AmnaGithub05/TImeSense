services:
  - type: web
    name: timesense-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: CACHE_DB_PATH
        value: /tmp/timesense.db
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: EMA_ALPHA
        value: "0.3"
      - key: FEW_SHOT_PATH
        value: prompts/few_shot.json
      - key: CORS_ORIGINS
        value: https://timesense-frontend.onrender.com

  - type: web
    name: timesense-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: timesense-api
          property: host
